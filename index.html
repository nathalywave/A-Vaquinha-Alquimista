

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Vaquinha Alquimista</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#20172f;color:#fff4fa;
  font-family:system-ui,sans-serif;display:grid;
  place-items:center;min-height:100vh;padding:12px
}
main{width:min(100%,1000px)}
header,.hud,#controls{
  display:flex;gap:8px;align-items:center;
  justify-content:space-between;flex-wrap:wrap
}
h1{color:#ffb8d2;font-size:clamp(1.3rem,3vw,2rem);margin:8px 0}
.pill{background:#39284f;border:1px solid #8f6cad;padding:6px 10px;border-radius:20px;font-size:.85rem}
#stage{position:relative;border:4px solid #ffc5df;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#overlay{position:absolute;inset:0;background:#160e25c9;display:grid;place-items:center;padding:16px;text-align:center}
#overlay.hidden{display:none}
.panel{max-width:650px;max-height:100%;overflow:auto;background:#2a1e40;border:2px solid #ffc5df;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0008}
.panel h2{color:#ffc5df;margin:0 0 8px}
button{border:0;border-radius:9px;padding:10px 15px;margin:4px;background:#ffb8d2;color:#281932;font-weight:800;cursor:pointer}
button.alt{background:#d9c9f5}
#credits{font-size:.9rem;line-height:1.6}
#controls{margin-top:10px}
#pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
#pad button{margin:0;padding:8px 0}
#fire{min-height:44px}
.small{font-size:.8rem;color:#d9cde7}
@media(pointer:coarse){#controls{display:flex}}
</style>
</head>
<body>
<main>
<header>
  <h1>🐮 A Vaquinha Alquimista</h1>
  <div class="hud">
    <span class="pill" id="phase">Menu</span>
    <span class="pill" id="progress">Comece a aventura</span>
    <span class="pill" id="ammo">Leite normal</span>
    <span class="pill" id="lives">❤️ 3</span>
  </div>
</header>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="overlay">
    <section class="panel">
      <h2 id="title">A Vaquinha Alquimista</h2>
      <p id="message">Proteja a fazenda, descubra a pedra mágica e resgate Seu Joaquim!</p>
      <div id="extra"></div>
      <button id="start">Jogar</button>
      <button class="alt" id="help">Como jogar</button>
    </section>
  </div>
</div>

<div id="controls">
  <div id="pad">
    <span></span><button data-key="ArrowUp">▲</button><span></span>
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowRight">▶</button>
  </div>
  <div>
    <button id="fire">Disparar leite</button>
    <div class="small">WASD/setas: andar • Espaço: disparar • P: pausar</div>
  </div>
</div>
</main>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const c=$('game'),g=c.getContext('2d'),W=c.width,H=c.height;
g.imageSmoothingEnabled=false;

// TODAS AS ARTES FICAM NA PASTA "imagens"
// A pasta deve estar ao lado deste arquivo index.html.
const files={
  menuFarm:'mapa-fazendinha-do-amor.jpg',
  menuForest:'mapa-floresta-dos-sussurros.jpg',
  farm:'fundo-celeiro.jpg',
  forest:'fundo-floresta.jpg',

  humanL:'vaquinha-hunana-esquerda.png',
  humanR:'vaquinha-hunana-direita.png',

  cowL:'vaca-lado-esquerdo.png',
  cowR:'vaca-lado-direito.png',
  front:'vaca-de-frente-parada.png',
  scared:'vaca-de-frente-assustada.png',
  back:'vaca-de-costas-parada.png',
  backGunL:'vaca-de-costas-com-arma-lado-esquerdo.png',
  backGunR:'vaca-de-costas-com-arma-lado-direito.png',

  frontStepR:'vaca-andando-para-frente-pe-direito-frente.png',
  frontStepL:'vaca-andando-para-frente-pe-esquerdo-frente.png',
  aimR:'vaca-apontando-arma-para-direita.png',
  aimL:'vaca-apontando-arma-para-esquerda.png',
  walkR:'vaca-caminhando-direita.png',
  walkL:'vaca-caminhando-esquerda.png',

  crystal:'cristal-magico.png',
  pestR:'praga-direita.png',
  pestL:'praga-esquerda.png',
  cultR:'seitista-direita.png',
  cultL:'seitista-esquerda.png',
  joaqR:'seu-joaquim-direita.png',
  joaqL:'seu-joaquim-esquerda.png'
};

const img={};
for(const k in files){
  img[k]=new Image();
  img[k].src='imagens/'+files[k];
}

let mode='menu';
let stage='farm';
let paused=false;
let score=0;
let lives=3;
let enhanced=false;
let crystalTaken=false;
let shots=[];
let enemies=[];
let spawn=0;
let lastShot=0;
let time=0;
let last=performance.now();
const keys={};

const cow={
  x:145,y:405,w:68,h:72,
  speed:240,dir:'right',moving:false,inv:0
};

// LIMITES DA VAQUINHA:
// left/right controlam os limites horizontais.
// top/bottom controlam os limites verticais.
// Ajuste depois de testar com as imagens reais.
const bounds={
  farm:{
    left:35,right:925,
    top:330,bottom:478
  },
  forest:{
    left:35,right:925,
    top:300,bottom:478
  }
};

function drawImg(k,x,y,w,h,fallback='#ffb8d2'){
  const a=img[k];

  if(a&&a.complete&&a.naturalWidth){
    g.drawImage(a,x,y,w,h);
  }else{
    // Desenho provisório caso uma imagem ainda não tenha carregado.
    g.fillStyle=fallback;
    g.fillRect(x,y,w,h);
    g.fillStyle='#34233e';
    g.fillRect(x+w*.25,y+h*.25,w*.12,h*.12);
    g.fillRect(x+w*.65,y+h*.25,w*.12,h*.12);
  }
}

function overlay(t,m,b,fn,b2='',fn2=null,credits=false){
  $('title').textContent=t;
  $('message').textContent=m;
  $('start').textContent=b;
  $('start').onclick=fn;

  $('help').style.display=b2?'inline-block':'none';

  if(b2){
    $('help').textContent=b2;
    $('help').onclick=fn2;
  }else{
    $('help').onclick=null;
  }

  $('extra').innerHTML=credits
    ?'<p id="credits"><b>Direção:</b> Nath Wave<br>'+
     '<b>Artes:</b> Lucas Trew<br>'+
     '<b>Roteiro:</b> Josieli Souza<br>'+
     '<b>Codificação:</b> Allan Theodoro e Ana Cláudia</p>'
    :'';

  $('overlay').classList.remove('hidden');
}

function hide(){
  $('overlay').classList.add('hidden');
}

function menu(){
  mode='menu';
  paused=false;
  stage='farm';
  hud();

  overlay(
    'A Vaquinha Alquimista',
    'A fazenda está em perigo! Use a arma de leite, encontre a pedra mágica e resgate Seu Joaquim na Floresta dos Sussurros.',
    'Jogar',reset,
    'Como jogar',help,
    true
  );
}

function help(){
  overlay(
    'Como jogar',
    'Use WASD ou as setas para se movimentar e Espaço para disparar leite. P pausa o jogo. A vaquinha fica limitada à área livre de cada cenário. Derrote 6 pragas, encontre a pedra azul e roxa e enfrente os sectários.',
    'Entendi',menu,
    'Voltar ao menu',menu
  );
}

function reset(){
  mode='playing';
  stage='farm';
  paused=false;
  score=0;
  lives=3;
  enhanced=false;
  crystalTaken=false;
  shots=[];
  enemies=[];
  spawn=0;
  time=0;

  cow.x=145;
  cow.y=420;
  cow.dir='right';
  cow.inv=0;

  hide();
  hud();
  last=performance.now();
}

function hud(){
  $('phase').textContent=
    mode==='playing'
      ?(stage==='farm'?'Fazendinha do Amor':'Floresta dos Sussurros')
      :mode==='ending'?'Final':'Menu';

  $('progress').textContent=
    mode==='playing'
      ?(stage==='farm'
          ?`Pragas: ${score}/6`
          :`Sectários: ${score-6}/6`)
      :'Comece a aventura';

  $('ammo').textContent=
    enhanced?'Leite alquímico forte':'Leite normal';

  $('lives').textContent='❤️ '+lives;
}

function sprite(){
  if(cow.dir==='left'){
    return cow.moving?'walkL':'cowL';
  }

  if(cow.dir==='right'){
    return cow.moving?'walkR':'cowR';
  }

  if(cow.dir==='up'){
    return keys[' ']
      ?(cow.dir==='left'?'backGunL':'backGunR')
      :'back';
  }

  return cow.moving
    ?(Math.floor(time*7)%2?'frontStepR':'frontStepL')
    :'front';
}

function shoot(){
  if(mode!=='playing'||paused||
     performance.now()-lastShot<340)return;

  lastShot=performance.now();

  const d=cow.dir==='left'?-1:1;

  shots.push({
    x:cow.x+d*28,
    y:cow.y-4,
    vx:d*(enhanced?520:420),
    damage:enhanced?2:1
  });
}

function spawnEnemy(){
  const type=stage==='farm'?'pest':'cult';
  const left=Math.random()<.5;

  enemies.push({
    type,
    x:left?30:930,
    y:bounds[stage].top+25+Math.random()*100,
    w:type==='pest'?44:52,
    h:type==='pest'?42:62,
    hp:2
  });
}

function finish(win){
  mode='ending';
  hud();

  overlay(
    win?'Seu Joaquim está salvo!':'Vamos tentar novamente?',
    win
      ?'A pedra mágica fundiu sua energia ao leite, fortalecendo a arma. Seu Joaquim foi resgatado e revela seu conhecimento de alquimia. Obrigada por jogar!'
      :'A floresta venceu desta vez. Tente de novo e use a pedra mágica para fortalecer seus disparos.',
    win?'Jogar novamente':'Tentar novamente',
    reset,
    'Voltar ao menu',menu,
    true
  );
}

function nextForest(){
  stage='forest';
  enemies=[];
  shots=[];
  spawn=0;
  cow.x=100;
  cow.y=420;
  cow.dir='right';
  mode='playing';
  hide();
  hud();
}

function draw(){
  if(mode==='menu'){
    drawImg('menuFarm',0,0,W,H,'#50854c');
    g.fillStyle='#180e2780';
    g.fillRect(0,0,W,H);
    g.fillStyle='white';
    g.font='bold 36px system-ui';
    g.textAlign='center';
    g.fillText('A Vaquinha Alquimista',W/2,72);
    return;
  }

  drawImg(
    stage==='farm'?'farm':'forest',
    0,0,W,H,
    stage==='farm'?'#79aa4c':'#183b38'
  );

  // Pedra mágica.
  if(!crystalTaken){
    const bob=Math.sin(time*3)*4;
    drawImg('crystal',W*.78-20,340+bob,42,48,'#8d69e9');
    g.fillStyle='white';
    g.font='14px system-ui';
    g.textAlign='center';
    g.fillText('Pedra misteriosa',W*.78,400+bob);
  }

  // Inimigos.
  for(const e of enemies){
    const k=e.type==='pest'
      ?(e.x<cow.x?'pestR':'pestL')
      :(e.x<cow.x?'cultR':'cultL');

    drawImg(
      k,e.x-e.w/2,e.y-e.h/2,e.w,e.h,
      e.type==='pest'?'#c4a54b':'#49305e'
    );
  }

  // Projéteis de leite.
  for(const s of shots){
    g.fillStyle=enhanced?'#a9cfff':'#fff4ed';
    g.strokeStyle=enhanced?'#9b70ef':'#d8c6d2';
    g.lineWidth=3;
    g.beginPath();
    g.ellipse(
      s.x,s.y,
      enhanced?13:9,
      enhanced?9:6,
      0,0,Math.PI*2
    );
    g.fill();
    g.stroke();
  }

  // Vaquinha.
  if(cow.inv<=0||Math.floor(time*12)%2){
    drawImg(
      sprite(),
      cow.x-cow.w/2,
      cow.y-cow.h/2,
      cow.w,cow.h
    );
  }

  // Seu Joaquim aparece na floresta.
  if(stage==='forest'&&score>=8){
    drawImg('joaqR',W-130,365,70,90,'#96724e');
  }

  if(paused){
    g.fillStyle='#160e25aa';
    g.fillRect(0,0,W,H);
    g.fillStyle='white';
    g.font='bold 42px system-ui';
    g.textAlign='center';
    g.fillText('PAUSADO',W/2,H/2);
  }
}

function update(dt){
  if(mode!=='playing'||paused)return;

  time+=dt;
  if(cow.inv>0)cow.inv-=dt;

  let dx=0,dy=0;

  if(keys.ArrowLeft||keys.a||keys.A){
    dx=-1;cow.dir='left';
  }
  if(keys.ArrowRight||keys.d||keys.D){
    dx=1;cow.dir='right';
  }
  if(keys.ArrowUp||keys.w||keys.W){
    dy=-1;
    if(!dx)cow.dir='up';
  }
  if(keys.ArrowDown||keys.s||keys.S){
    dy=1;
    if(!dx)cow.dir='down';
  }

  cow.moving=!!(dx||dy);

  if(dx&&dy){
    dx*=.707;
    dy*=.707;
  }

  // Impede a vaquinha de sair dos limites da área jogável.
  const b=bounds[stage];

  cow.x=Math.max(
    b.left+cow.w/2,
    Math.min(b.right-cow.w/2,cow.x+dx*cow.speed*dt)
  );

  cow.y=Math.max(
    b.top+cow.h/2,
    Math.min(b.bottom-cow.h/2,cow.y+dy*cow.speed*dt)
  );

  if(keys[' '])shoot();

  // Surgimento de inimigos.
  spawn-=dt;

  if(spawn<=0&&score<(stage==='farm'?6:12)){
    spawnEnemy();
    spawn=stage==='farm'?1.15:.9;
  }

  // Inimigos perseguem a vaquinha.
  for(const e of enemies){
    const dx2=cow.x-e.x;
    const dy2=cow.y-e.y;
    const len=Math.hypot(dx2,dy2)||1;

    e.x+=dx2/len*(stage==='farm'?35:45)*dt;
    e.y+=dy2/len*25*dt;

    if(
      Math.abs(e.x-cow.x)<38&&
      Math.abs(e.y-cow.y)<42&&
      cow.inv<=0
    ){
      lives--;
      cow.inv=1.3;

      if(lives<=0){
        finish(false);
        return;
      }
    }
  }

  // Movimento dos projéteis.
  shots.forEach(s=>s.x+=s.vx*dt);
  shots=shots.filter(s=>s.x>-20&&s.x<W+20);

  // Colisões entre leite e inimigos.
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];

    const j=shots.findIndex(s=>
      Math.abs(s.x-e.x)<e.w*.45&&
      Math.abs(s.y-e.y)<e.h*.45
    );

    if(j>=0){
      e.hp-=shots[j].damage;
      shots.splice(j,1);

      if(e.hp<=0){
        enemies.splice(i,1);
        score++;

        if(stage==='farm'&&score>=6){
          mode='story';
          hud();

          overlay(
            'Um brilho na floresta',
            'A vaquinha encontra uma pedra azul e roxa. Sua energia reage ao leite e revela um caminho até a Floresta dos Sussurros.',
            'Ir para a floresta',nextForest,
            'Voltar ao menu',menu
          );
          return;
        }

        if(stage==='forest'&&score>=12){
          finish(true);
          return;
        }
      }
    }
  }

  // Coletar a pedra mágica.
  if(
    !crystalTaken&&
    Math.abs(cow.x-W*.78)<48&&
    Math.abs(cow.y-364)<55
  ){
    crystalTaken=true;
    enhanced=true;
    mode='story';
    hud();

    overlay(
      'Fusão alquímica!',
      'O leite se fundiu com a pedra azul e roxa. A arma agora dispara leite alquímico mais forte!',
      'Continuar',
      ()=>{
        mode='playing';
        hide();
        hud();
      }
    );
    return;
  }

  // Resgate de Seu Joaquim.
  if(
    stage==='forest'&&score>=8&&
    Math.abs(cow.x-(W-130))<65&&
    Math.abs(cow.y-400)<70
  ){
    finish(true);
    return;
  }

  hud();
}

function loop(t){
  const dt=Math.min((t-last)/1000||0,.04);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Teclado.
window.addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
  }

  keys[e.key]=true;

  if(e.key.toLowerCase()==='p'&&mode==='playing'){
    paused=!paused;
  }
});

window.addEventListener('keyup',e=>{
  keys[e.key]=false;
});

// Botões de movimento para celular.
document.querySelectorAll('[data-key]').forEach(b=>{
  const k=b.dataset.key;

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    keys[k]=true;
    b.setPointerCapture(e.pointerId);
  });

  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
    b.addEventListener(ev,e=>{
      e.preventDefault();
      keys[k]=false;
    });
  });
});

// Botão de disparo para celular.
$('fire').addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[' ']=true;
});

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  $('fire').addEventListener(ev,()=>keys[' ']=false);
});

menu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
